<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150" role="img" aria-labelledby="t d">
<title id="t">GeoDistance diagram</title>
<desc id="d">Left: the distance is the gap between the closest points of two shapes. Right: with use_centroid=True it is the distance between their centroids.</desc>
<style>
:root{--bg:#f6f8fa;--border:#d0d7de;--text:#1f2328;--a:#0969da;--b:#bc4c00;--hl:#8250df}
@media (prefers-color-scheme:dark){:root{--bg:#161b22;--border:#30363d;--text:#e6edf3;--a:#58a6ff;--b:#f0883e;--hl:#a371f7}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text)}
.res{font-size:30px;font-weight:700}
.card{fill:var(--bg);stroke:var(--border)}
.sep{stroke:var(--border);stroke-width:1}
.a{fill:var(--a);fill-opacity:.2;stroke:var(--a);stroke-width:2}
.b{fill:var(--b);fill-opacity:.2;stroke:var(--b);stroke-width:2}
.oa{fill:none;stroke:var(--a);stroke-width:1.5}
.ob{fill:none;stroke:var(--b);stroke-width:1.5}
.hl{fill:var(--hl)}
.bar{stroke:var(--text);stroke-width:2}
.dist{stroke:var(--text);stroke-width:2;fill:none}
.dash{stroke:var(--text);stroke-width:2;stroke-dasharray:5 4;fill:none}
.da{fill:var(--a)}
.db{fill:var(--b)}
</style>
<rect class="card" x=".5" y=".5" width="499" height="149" rx="12"/>
<line class="sep" x1="250.0" x2="250.0" y1="16" y2="134"/>
<rect class="a" x="64" y="54" width="72" height="44"/>
<rect class="b" x="168" y="42" width="40" height="24"/>
<line class="dist" x1="136" x2="168" y1="60.0" y2="60.0"/>
<line class="dist" x1="136" x2="136" y1="54.0" y2="66.0"/>
<line class="dist" x1="168" x2="168" y1="54.0" y2="66.0"/>
<rect class="a" x="314" y="54" width="72" height="44"/>
<rect class="b" x="418" y="42" width="40" height="24"/>
<line class="dash" x1="350.0" y1="76.0" x2="438.0" y2="54.0"/>
<circle class="da" cx="350.0" cy="76.0" r="4.5"/>
<circle class="db" cx="438.0" cy="54.0" r="4.5"/>
</svg>
