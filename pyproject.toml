[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geosplink"
version = "0.0.2"
description = "Geospatial comparators for Splink."
authors = [{ name = "Thijmen van der Wielen" }]
requires-python = ">=3.10"
license = "MIT"
dependencies = ["splink>=4.0", "duckdb>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/geosplink"]
